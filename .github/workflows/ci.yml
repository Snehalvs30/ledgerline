name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # push images to GitHub Container Registry

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/snehalvs30/ledgerline

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests. Testcontainers starts PostgreSQL and Kafka using
      # the Docker engine that GitHub's Ubuntu runners already have.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  image:
    name: Build, scan, deploy to Kubernetes, publish
    needs: test          # never build an image from code whose tests failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      # Fail the pipeline on serious vulnerabilities that already have a fix available.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # ---- Deploy the exact image to a throwaway Kubernetes cluster and smoke-test it ----
      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ledgerline

      - name: Load image into the cluster
        run: kind load docker-image $IMAGE:${{ github.sha }} --name ledgerline

      - name: Generate throwaway secrets
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n ledgerline create secret generic ledgerline-secrets \
            --from-literal=db-password="$(openssl rand -hex 16)" \
            --from-literal=jwt-secret="$JWT_SECRET"
          # Deploy this commit's image, not ":latest".
          kubectl kustomize k8s | sed "s|$IMAGE:latest|$IMAGE:${{ github.sha }}|" | kubectl apply -f -

      - name: Smoke test the deployment
        run: ./k8s/smoke-test.sh

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n ledgerline get pods -o wide || true
          kubectl -n ledgerline describe pods || true
          kubectl -n ledgerline logs deployment/ledgerline --all-containers --tail=200 || true
          kubectl -n ledgerline get events --sort-by=.lastTimestamp || true

      # ---- Publish only from main, and only images that passed everything above ----
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

#      - name: Push image
#        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#        run: |
#          docker push $IMAGE:${{ github.sha }}
#          docker push $IMAGE:latest
      # Publish for both Intel (amd64) and ARM (arm64): Apple Silicon, kind on
      # Macs, and Graviton servers. The tests, Trivy scan and kind smoke test above
      # all ran on the amd64 build; this rebuilds the same commit for both CPUs.
      # Publish for both Intel (amd64) and ARM (arm64): Apple Silicon, kind on
      # Macs, and Graviton servers. The tests, Trivy scan and kind smoke test above
      # all ran on the amd64 build; this rebuilds the same commit for both CPUs.
      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest