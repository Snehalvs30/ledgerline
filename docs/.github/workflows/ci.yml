name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # push images to GitHub Container Registry

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/snehalvs30/ledgerline

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests. Testcontainers starts PostgreSQL and Kafka using
      # the Docker engine that GitHub's Ubuntu runners already have.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  image:
    name: Build, scan and publish image
    needs: test          # never build an image from code whose tests failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      # Fail the pipeline on serious vulnerabilities that already have a fix available.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Publish only from main, never from pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest