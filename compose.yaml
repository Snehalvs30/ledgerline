services:
  postgres:
    image: postgres:17
    container_name: ledgerline-postgres
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). The official image's defaults
  # listen on localhost:9092, which is what the app connects to.
  kafka:
    image: apache/kafka:4.0.0
    container_name: ledgerline-kafka
    ports:
      - "9092:9092"

  # Scrapes the app's /actuator/prometheus endpoint every 5 seconds.
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: ledgerline-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach the app on your Mac

  # Dashboards at http://localhost:3000 (no login locally).
  grafana:
    image: grafana/grafana:12.0.0
    container_name: ledgerline-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin      # local development only
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata: