services:
  postgres:
    image: postgres:17
    container_name: ledgerline-postgres
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). The official image's defaults
  # listen on localhost:9092, which is what the app connects to.
  kafka:
    image: apache/kafka:4.0.0
    container_name: ledgerline-kafka
    ports:
      - "9092:9092"

volumes:
  pgdata: