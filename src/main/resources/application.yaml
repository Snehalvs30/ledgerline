spring:
  application:
    name: ledgerline

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerline
    username: ${DB_USERNAME:ledgerline}
    password: ${DB_PASSWORD:ledgerline}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep DB connections open during HTTP view rendering.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always   # fine for local dev; restrict before deploying