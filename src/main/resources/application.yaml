spring:
  application:
    name: ledgerline

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerline
    username: ${DB_USERNAME:ledgerline}
    password: ${DB_PASSWORD:ledgerline}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep DB connections open during HTTP view rendering.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        # Fail fast when Kafka is down, so the outbox relay retries on its next run
        # instead of blocking for the 60-second defaults.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # A brand-new consumer group starts from the oldest event, so nothing is skipped.
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always   # fine for local dev; restrict before deploying
  metrics:
    distribution:
      # Record latency histograms so Prometheus can compute p95/p99 across requests.
      percentiles-histogram:
        "[http.server.requests]": true

ledgerline:
  outbox:
    topic: ledger.transfers
    poll-interval-ms: 500
    batch-size: 500
  reconciliation:
    initial-delay-ms: 10000
    interval-ms: 60000
  security:
    # HS256 signing key (at least 32 bytes). This default is for local development ONLY.
    # Every real environment must override it: LEDGERLINE_SECURITY_JWT_SECRET=...
    jwt-secret: ${LEDGERLINE_SECURITY_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: ledgerline-dev
    audience: ledgerline-api
    token-ttl: PT1H
    dev-tokens:
      # POST /dev/token mints tokens for local testing. Off unless the "local" profile is on.
      enabled: false